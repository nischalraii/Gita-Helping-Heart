services:
  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_KEY: ${APP_KEY:?run "php artisan key:generate --show" and export APP_KEY}
      LOG_CHANNEL: stderr

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: gita
      DB_USERNAME: gita
      DB_PASSWORD: secret

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      MAIL_MAILER: smtp
      MAIL_HOST: mail
      MAIL_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist uploads across restarts; point FILESYSTEM_DISK at s3 instead
      # if you deploy somewhere with an ephemeral disk.
      - uploads:/app/storage/app/public

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gita
      POSTGRES_USER: gita
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gita -d gita"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  mail:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  pgdata:
  uploads:
